server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  datasource:
    # Supabase: use port 6543 (pooler) for production, 5432 (direct) for local dev
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: UnshackledHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
  security:
    filter:
      order: 10
  task:
    scheduling:
      pool:
        size: 5

supabase:
  url: ${SUPABASE_URL:https://your-project.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:your-anon-key}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key}
  jwt-secret: ${SUPABASE_JWT_SECRET:your-jwt-secret}

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_xxx}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_xxx}
  price-id: ${STRIPE_PRICE_ID:price_xxx}

webpush:
  public-key: ${VAPID_PUBLIC_KEY:your-vapid-public-key}
  private-key: ${VAPID_PRIVATE_KEY:your-vapid-private-key}
  subject: ${VAPID_SUBJECT:mailto:noreply@unshackled.app}

resend:
  api-key: ${RESEND_API_KEY:re_xxx}
  from-email: ${RESEND_FROM_EMAIL:noreply@unshackled.app}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
