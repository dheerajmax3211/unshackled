# Development profile overrides
spring:
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5

logging:
  level:
    com.unshackled: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

app:
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  price-id: ${STRIPE_PRICE_ID:price_placeholder}

webpush:
  public-key: ${WEBPUSH_PUBLIC_KEY:placeholder}
  private-key: ${WEBPUSH_PRIVATE_KEY:placeholder}
  subject: mailto:placeholder@example.com

resend:
  api-key: ${RESEND_API_KEY:re_placeholder}
  from-email: admin@unshackled.app
